blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/nchemb/opencalendar/security/advisories/new
    about: Report privately. Please do not open a public issue.
  - name: Question or idea
    url: https://github.com/nchemb/opencalendar/discussions
    about: For anything that is not a specific bug.
  - name: You want teams, round-robin, or SMS
    url: https://cal.com
    about: >-
      OpenCalendar is deliberately a solo-operator tool and will not grow these.
      Cal.com is open source and does them well.
