name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing in CI may reach a real service. The suites assert this themselves.
  BOOKKIT_CALENDAR: memory
  # Present so `prisma generate` (npm ci postinstall) has a datasource to read.
  # Nothing connects to it; each job overrides the URL it actually uses.
  DATABASE_URL: postgresql://bookkit:bookkit@localhost:5432/bookkit
  DIRECT_URL: postgresql://bookkit:bookkit@localhost:5432/bookkit

jobs:
  check:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookkit
          POSTGRES_PASSWORD: bookkit
          POSTGRES_DB: bookkit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://bookkit:bookkit@localhost:5432/bookkit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookkit
          POSTGRES_PASSWORD: bookkit
          POSTGRES_DB: bookkit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://bookkit:bookkit@localhost:5432/bookkit_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    env:
      # Prisma needs a syntactically valid URL to generate against; nothing connects.
      DATABASE_URL: postgresql://user:password@localhost:5432/bookkit
      DIRECT_URL: postgresql://user:password@localhost:5432/bookkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
